name: Предложение фичи / Feature request
description: Предложить новую функцию или улучшение для Sit and Lay
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за идею! Опишите, что хотелось бы видеть в моде.

  - type: textarea
    id: problem
    attributes:
      label: Какую проблему это решает / зачем это нужно
      description: Например — не хватает позы для сидения на краю блока свесив ноги
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Как это могло бы работать
      description: Ваше видение реализации (необязательно)
    validations:
      required: false

  - type: dropdown
    id: loader
    attributes:
      label: Для какого лоадера актуально
      description: Если фича касается конкретной версии, а не всех сразу
      options:
        - Все версии
        - Fabric 26.3
        - Fabric 1.20.1
        - NeoForge 1.21.1
        - Forge 1.20.1
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Перед отправкой
      options:
        - label: Я проверил(а), что такого предложения ещё нет среди открытых Issues
          required: true
